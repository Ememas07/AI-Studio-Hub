<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My AI Studio Projects</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 3rem 1rem; margin: 0; }
    h1 { margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; width: 100%; max-width: 800px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; text-decoration: none; color: inherit; transition: transform 0.15s, border-color 0.15s; }
    .card:hover { transform: translateY(-3px); border-color: #38bdf8; }
    .card h2 { margin: 0 0 0.5rem 0; font-size: 1.25rem; color: #38bdf8; }
    .card p { margin: 0; color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>AI Studio Hub</h1>
  <div class="grid">
    <!-- Replace href values with your exact GitHub repository names -->
    <a class="card" href="/repo-1/">
      <h2>Project 1</h2>
      <p>Description of your first AI Studio app.</p>
    </a>
    <a class="card" href="/repo-2/">
      <h2>Project 2</h2>
      <p>Description of your second AI Studio app.</p>
    </a>
    <a class="card" href="/repo-3/">
      <h2>Project 3</h2>
      <p>Description of your third AI Studio app.</p>
    </a>
    <a class="card" href="/repo-4/">
      <h2>Project 4</h2>
      <p>Description of your fourth AI Studio app.</p>
    </a>
  </div>
</body>
</html>
